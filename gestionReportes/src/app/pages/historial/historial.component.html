<div class="page-layout">

  <!-- Navbar Placeholder con texto grande -->
  <header class="navbar">
    <span class="placeholder-text">NAVBAR</span>
  </header>

  <!-- Contenido Principal -->
  <main class="historial-container">
    <div class="header-bar">
      <h2>Historial de Reclamos</h2>
      <div class="filter-group">
        <label for="estado">Filtrar por estado:</label>
        <!-- Usamos la función segura del TypeScript -->
        <select id="estado" class="select-filter" (change)="onFiltroChange($event)">
          <option value="">Todos</option>
          <option value="Recibido">Recibido</option>
          <option value="En proceso">En proceso</option>
          <option value="Resuelto">Resuelto</option>
          <option value="Cerrado">Cerrado</option>
        </select>
      </div>
    </div>

    <div class="table-card">
      <table class="reclamos-table">
        <thead>
          <tr>
            <th>Folio</th>
            <th>Categoría</th>
            <th>Ubicación</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <!-- Recorre la lista filtrada -->
          <tr *ngFor="let item of reclamosFiltrados">
            <td><strong>#{{ item.id }}</strong></td>
            <td>
              <div class="cat-title">{{ item.categoria }}</div>
              <small class="sub-cat">{{ item.subcategoria }}</small>
            </td>
            <td>{{ item.ubicacion }}</td>
            <td>{{ item.fecha }}</td>
            <td>
              <span class="status-badge" [ngClass]="item.css">
                {{ item.estado }}
              </span>
            </td>
            <td>
              <button type="button" class="btn-action">Ver detalle</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Footer Placeholder con texto grande -->
  <footer class="footer">
    <span class="placeholder-text">FOOTER</span>
  </footer>

</div>
