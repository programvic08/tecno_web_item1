<app-header subtitulo="CONSULTA DE RECLAMOS AL CIUDADANO"></app-header>

<div class="page-layout">
  <main class="historial-container">
    <div class="header-bar">
      <h2>Historial de Reclamos</h2>
      <div class="filter-group">
        <label for="estado">Filtrar por estado:</label>
        <select id="estado" class="select-filter" (change)="onFiltroChange($event)">
          <option value="">Todos</option>
          <option value="Recibido">Recibido</option>
          <option value="En proceso">En proceso</option>
          <option value="Resuelto">Resuelto</option>
          <option value="Cerrado">Cerrado</option>
        </select>
      </div>
    </div>

    <div class="table-card">
      <table class="reclamos-table">
        <thead>
          <tr>
            <th>Folio</th>
            <th>Categoría</th>
            <th>Ubicación</th>
            <th>Fecha</th>
            <th>Estado</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let item of reclamosFiltrados">
            <td><strong>#{{ item.id }}</strong></td>
            <td>
              <div class="cat-title">{{ item.categoria }}</div>
              <small class="sub-cat">{{ item.subcategoria }}</small>
            </td>
            <td>{{ item.ubicacion }}</td>
            <td>{{ item.fecha }}</td>
            <td>
              <app-status-badge [estado]="item.estado"></app-status-badge>
            </td>
            <td>
              <button type="button" class="btn-action" (click)="verDetalle(item.folio)">Ver estado</button>
            </td>
          </tr>

          <tr *ngIf="reclamosFiltrados.length === 0">
            <td colspan="6" style="text-align: center; padding: 20px;">
              No se encontraron reclamos registrados.
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<app-footer></app-footer>
