<div class="profile-grid">
  
  <!-- Columna izquierda: Formulario -->
  <div class="profile-form">
    <div class="form-group">
      <label class="field-label">Nombre(s)</label>
      <div class="field-value">{{ usuario.nombre }}</div>
    </div>

    <div class="form-group">
      <label class="field-label">Apellido(s)</label>
      <div class="field-value">{{ usuario.apellido }}</div>
    </div>

    <div class="form-group">
      <label class="field-label">Dirección</label>
      <div class="field-value empty-field">
        <!-- Si la dirección está vacía, muestra 'No registrada'; de lo contrario, muestra el valor -->
        <span>{{ usuario.direccion ? usuario.direccion : 'No registrada' }}</span>
        <button type="button" class="btn-link" (click)="modificarDireccion()">Agregar dirección</button>
      </div>
    </div>
  </div>

  <!-- Columna derecha: Avatar -->
  <section class="avatar-section">
    <label class="field-label">Foto de perfil</label>
    <div class="avatar-circle">
      <svg viewBox="0 0 100 100" class="avatar-icon">
        <circle cx="50" cy="38" r="22" fill="#d0d0d0" />
        <path d="M 15 90 A 35 35 0 0 1 85 90 Z" fill="#d0d0d0" />
      </svg>
    </div>
    <button type="button" class="btn-action">Editar foto</button>
  </section>

</div>
