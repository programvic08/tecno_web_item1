<div class="contenedor-login">
  <div class="titulo-login">
    <h1>Iniciar sesión</h1>
    <p>Accede con tu cuenta municipal</p>
  </div>

  <div class="formulario-login">
    <form #formLogin="ngForm" (ngSubmit)="onSubmit(formLogin)">
      <div class="form-elements">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" #emailInput="ngModel"
               placeholder="tucorreo@ejemplo.com" autocomplete="username" required email>
        <small class="error-campo" *ngIf="emailInput.invalid && (emailInput.dirty || emailInput.touched)">
          <span *ngIf="emailInput.errors?.['required']">El correo es obligatorio.</span>
          <span *ngIf="emailInput.errors?.['email']">Ingresa un correo válido.</span>
        </small>
      </div>

      <div class="form-elements">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" #passwordInput="ngModel"
               placeholder="••••••••" autocomplete="current-password" required minlength="6">
        <small class="error-campo" *ngIf="passwordInput.invalid && (passwordInput.dirty || passwordInput.touched)">
          <span *ngIf="passwordInput.errors?.['required']">La contraseña es obligatoria.</span>
          <span *ngIf="passwordInput.errors?.['minlength']">Debe tener al menos 6 caracteres.</span>
        </small>
      </div>

      <div class="recuperar-contraseña">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <p class="mensaje-error" *ngIf="errorMessage" role="alert">{{ errorMessage }}</p>

      <button type="submit" class="btn-ingresar" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <hr class="divider">

    <div class="usuario">
      <p>Cuentas de prueba:</p>
      <div class="user-buttons">
        <button type="button" class="btn-user" *ngFor="let cuenta of cuentasPrueba"
                [disabled]="cargando" (click)="usarCuentaPrueba(cuenta)">
          {{ cuenta.rol }}
        </button>
      </div>
    </div>
  </div>

  <div class="login-footer">
    <p>¿No tienes cuenta? <a href="#">Crear una</a></p>
  </div>
</div>
