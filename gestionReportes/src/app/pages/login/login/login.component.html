

<head>
    <title>Iniciar Sesión - Municipalidad</title>
    <link rel="stylesheet" href="login.component.css">
</head>
<body>
    
    <div class="contenedor-login">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=settings" />
        
        <!----Encabezado Título -->
        <div class="titulo-login">
            <h1>Iniciar sesión</h1>
            <p>Accede con tu cuenta municipal</p>
        </div>
        
        <div class="formulario-login">
            <form>
                <div class="form-elements">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" placeholder="tucorreo@ejemplo.com" required>
                </div>
                <div class="form-elements">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <div class="recuperar-contraseña">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                </div>
                <button type="submit" class="btn-ingresar">Ingresar</button>
            </form>

      <hr class="divider">

      <!-- Botones de Prueba -->
      <div class="usuario">
        <p>Cuentas de prueba:</p>
        <div class="user-buttons">
          <button type="button" class="btn-user" routerLink="/userHome">Ciudadano</button>
          <button type="button" class="btn-user" routerLink="/adminHome">Administrador</button>
        </div>
      </div>
    </div>

    <!-- Enlace de Registro -->
    <div class="login-footer">
      <p>¿No tienes cuenta? <a href="#">Crear una</a></p>
    </div>
  </div>

</body>
