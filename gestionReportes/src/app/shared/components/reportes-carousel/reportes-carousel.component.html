<section
  class="carrusel"
  role="region"
  aria-roledescription="carrusel"
  aria-label="Funciones y accesos del sistema"
  (mouseenter)="pausar()"
  (mouseleave)="reanudar()"
  (focusin)="pausar()"
  (focusout)="reanudar()"
>
  <div
    class="pista"
    [style.transform]="'translateX(-' + indiceActual * 100 + '%)'"
  >
    <article
      class="lamina"
      *ngFor="let item of items; let i = index"
      [ngClass]="'fondo-' + item.tema"
      [attr.aria-hidden]="i !== indiceActual"
    >
      <div class="caja">
        <span class="chip">{{ item.etiqueta }}</span>

        <h2>{{ item.titulo }}</h2>

        <p>{{ item.descripcion }}</p>

        <!-- Enlaces a páginas del sistema -->
        <a
          *ngIf="item.ruta"
          class="mas"
          [routerLink]="item.ruta"
          [attr.tabindex]="i === indiceActual ? null : -1"
        >
          {{ item.boton }} →
        </a>

        <!-- Enlace a la guía PDF -->
        <a
          *ngIf="item.urlPdf"
          class="mas"
          [href]="item.urlPdf"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="item.boton + ' (PDF, se abre en una pestaña nueva)'"
          [attr.tabindex]="i === indiceActual ? null : -1"
        >
          {{ item.boton }} →
        </a>

        <!-- Botones que llevan a una sección de la página -->
        <button
          *ngIf="item.seccionDestino"
          type="button"
          class="mas accion-seccion"
          (click)="irASeccion.emit(item.seccionDestino)"
          [attr.tabindex]="i === indiceActual ? null : -1"
        >
          {{ item.boton }} →
        </button>
      </div>
    </article>
  </div>

  <ng-container *ngIf="items.length > 1">
    <button
      class="flecha prev"
      type="button"
      (click)="anterior()"
      aria-label="Anterior"
    >
      ‹
    </button>

    <button
      class="flecha next"
      type="button"
      (click)="siguiente()"
      aria-label="Siguiente"
    >
      ›
    </button>

    <div class="puntos">
      <button
        *ngFor="let item of items; let i = index"
        type="button"
        class="punto"
        [class.activo]="i === indiceActual"
        (click)="seleccionar(i)"
        [attr.aria-label]="'Ir a la lámina ' + (i + 1)"
      ></button>
    </div>
  </ng-container>
</section>
