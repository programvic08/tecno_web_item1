<div [class.fondo-tareas]="!sobreCarrusel">
<div class="contenedor tareas" [class.tareas--sin-carrusel]="!sobreCarrusel">
  <div class="tareas-card">
    <h2>{{ titulo }}</h2>
    <nav class="lista" [attr.aria-label]="titulo">
      <a *ngFor="let tarea of tareas" [routerLink]="tarea.ruta" [queryParams]="tarea.queryParams">
        {{ tarea.etiqueta }}
      </a>
    </nav>
  </div>
</div>
</div>
