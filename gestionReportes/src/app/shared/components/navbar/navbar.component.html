<header class="cabecera-portal" *ngIf="usuario$ | async as usuario">
  <a [routerLink]="getHomeRoute(usuario)" class="enlace-home" style="text-decoration: none; color: inherit; display: flex; align-items: center; gap: 1rem;">
    <span class="sello" aria-hidden="true">NY</span>
    <div class="identidad">
      <span class="marca">{{ marca }}</span>
      <span class="subtitulo">Trámites y servicios al ciudadano</span>
    </div>
  </a>
</header>

<nav class="navbar" aria-label="Navegación principal">

  <div class="enlaces" *ngIf="apartados$ | async as apartados">
    <ng-container *ngFor="let apartado of apartados">
      <a *ngIf="apartado.ruta; else proximamente" [routerLink]="apartado.ruta"
         [class.activo]="activo(apartado)"
         [attr.aria-current]="activo(apartado) ? 'page' : null">
        <svg class="icono-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"
             [ngSwitch]="apartado.etiqueta">
          <path *ngSwitchCase="'Inicio'" d="M3 10 12 3l9 7v11h-6v-7H9v7H3Z" />
          <path *ngSwitchCase="'Crear reclamo'" d="M6 17V9a6 6 0 0 1 12 0v8M4 17h16M10 21h4M12 2v2M12 8v4M12 15h.01" />
          <path *ngSwitchCase="'Historial'" d="M3 4v6h6M3 10a9 9 0 1 1 1 8M12 7v5l4 2" />
          <path *ngSwitchCase="'Agentes'" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" />
          <path *ngSwitchDefault d="M3 3h18v18H3ZM7 16v-4M12 16V8M17 16V6" />
        </svg>
        <span>{{ apartado.etiqueta }}</span>
      </a>
      <ng-template #proximamente>
        <span class="pronto" title="Próximamente" aria-disabled="true">{{ apartado.etiqueta }}</span>
      </ng-template>
    </ng-container>
  </div>

  <div class="sesion" *ngIf="usuario$ | async as usuario">

    <button type="button" class="notificaciones-boton" (click)="alternarNotificaciones()"
            aria-label="Notificaciones" [attr.aria-expanded]="notificacionesAbiertas">
      <span class="campana" aria-hidden="true">🔔</span>
      <span class="contador" *ngIf="noLeidas$ | async as noLeidas">{{ noLeidas > 99 ? '99+' : noLeidas }}</span>
    </button>

    <div class="menu-fondo" *ngIf="notificacionesAbiertas" (click)="cerrarNotificaciones()"></div>
    <div class="menu-notificaciones" *ngIf="notificacionesAbiertas">
      <div class="notificaciones-titulo">
        <strong>Notificaciones</strong>
        <button type="button" (click)="marcarTodasComoLeidas()">Marcar como leídas</button>
      </div>
      <div *ngIf="notificaciones$ | async as notificaciones">
        <button type="button" class="notificacion" *ngFor="let notificacion of notificaciones"
                [class.no-leida]="!notificacion.leida" (click)="marcarComoLeida(notificacion)">
          <strong>{{ notificacion.titulo }}</strong>
          <span>{{ notificacion.mensaje }}</span>
          <small>{{ notificacion.fecha | date:'dd/MM/yyyy HH:mm' }}</small>
        </button>
        <p class="sin-notificaciones" *ngIf="notificaciones.length === 0">No tienes notificaciones nuevas.</p>
      </div>
    </div>

    <button type="button" class="perfil-boton" (click)="alternarMenu()"
            aria-label="Menú de usuario" [attr.aria-expanded]="menuAbierto">
      <span class="avatar">{{ iniciales(usuario.nombre) }}</span>
    </button>

    <!-- Fondo invisible: cierra el menú al hacer clic fuera -->
    <div class="menu-fondo" *ngIf="menuAbierto" (click)="cerrarMenu()"></div>

    <div class="menu-usuario" *ngIf="menuAbierto">
      <p class="menu-nombre">{{ usuario.nombre }}</p>
      <p class="menu-correo">{{ usuario.email }}</p>
      <a [routerLink]="rutaPerfil" (click)="cerrarMenu()">Modificar perfil</a>
      <button type="button" class="salir" (click)="cerrarSesion()">Cerrar sesión</button>
    </div>

  </div>

</nav>
